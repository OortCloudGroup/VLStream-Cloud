name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "8"
          cache: maven
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: VLStream-Web/VLStream-ui/package-lock.json
      - name: Verify release version
        working-directory: VLStream-Cloud-Backend-Server/vls-stream
        run: |
          version="${GITHUB_REF_NAME#v}"
          backend_version=$(python3 -c 'import xml.etree.ElementTree as ET; root=ET.parse("pom.xml").getroot(); print(root.findtext("{http://maven.apache.org/POM/4.0.0}version"))')
          frontend_version=$(python3 -c 'import json; print(json.load(open("../../VLStream-Web/VLStream-ui/package.json", encoding="utf-8"))["version"])')
          printf 'Tag version: %s\nBackend POM version: %s\nFrontend package version: %s\n' "$version" "$backend_version" "$frontend_version"
          test "$backend_version" = "$version"
          test "$frontend_version" = "$version"
      - name: Reject private billing configuration from public release
        run: |
          if test -e VLStream-Cloud-Backend-Server/vls-stream/ruoyi-admin/config/application.yml; then
            echo ::error::Private billing configuration must not enter public release artifacts
            exit 1
          fi
      - name: Build backend
        working-directory: VLStream-Cloud-Backend-Server/vls-stream
        run: mvn -ntp -Pprod -Dmaven.test.skip=true clean package
      - name: Verify backend logging binding
        working-directory: VLStream-Cloud-Backend-Server/vls-stream
        run: |
          if unzip -l ruoyi-admin/target/vls-stream.jar | grep -q 'BOOT-INF/lib/slf4j-simple-'; then
            echo "::error::The backend archive contains the conflicting slf4j-simple binding"
            exit 1
          fi
          unzip -l ruoyi-admin/target/vls-stream.jar | grep -q 'BOOT-INF/lib/logback-classic-'
          unzip -p ruoyi-admin/target/vls-stream.jar BOOT-INF/classes/application.yml | grep -q 'locations: classpath:db/migration/mainline'
          unzip -p ruoyi-admin/target/vls-stream.jar BOOT-INF/classes/application-prod.yml | grep -q 'spring.flyway.locations: classpath:db/migration/release'
          if unzip -l ruoyi-admin/target/vls-stream.jar | grep -q 'BOOT-INF/classes/application-dev.yml'; then
            echo "::error::The production backend archive must not contain development credentials"
            exit 1
          fi
          if unzip -l ruoyi-admin/target/vls-stream.jar | grep -q BOOT-INF/classes/private/compute-billing/application.yml; then
            echo ::error::The public backend JAR must not contain private billing configuration
            exit 1
          fi
          unzip -l ruoyi-admin/target/vls-stream.jar | grep -q 'BOOT-INF/classes/db/migration/release/V1_2_0_028__repair_climbing_annotation_statistics.sql'
          unzip -l ruoyi-admin/target/vls-stream.jar | grep -q 'BOOT-INF/classes/db/migration/mainline/V1_2_0_059__cloud_ai_active_safety_event_owner.sql'
          unzip -l ruoyi-admin/target/vls-stream.jar | grep -q 'BOOT-INF/classes/db/migration/release/V1_2_0_060__cloud_ai_active_safety_event_owner.sql'
          unzip -l ruoyi-admin/target/vls-stream.jar | grep -q 'BOOT-INF/classes/db/migration/release/V1_2_0_061__repair_local_permission_catalogue_parents.sql'
          unzip -l ruoyi-admin/target/vls-stream.jar | grep -q 'BOOT-INF/classes/db/migration/release/V1_2_0_067__create_trusted_workflow_ownership.sql'
          unzip -l ruoyi-admin/target/vls-stream.jar | grep -q 'BOOT-INF/classes/db/migration/release/V1_2_0_068__register_basic_console_menu_catalogue.sql'
          unzip -l ruoyi-admin/target/vls-stream.jar | grep -q 'BOOT-INF/classes/db/migration/release/V1_2_0_069__consolidate_system_menu_catalogue.sql'
          unzip -l ruoyi-admin/target/vls-stream.jar | grep -q  BOOT-INF/classes/db/migration/release/V1_2_0_070__platform_video_recording.sql
          unzip -l ruoyi-admin/target/vls-stream.jar | grep -q BOOT-INF/classes/db/migration/release/V1_2_0_071__platform_recording_retention.sql
          unzip -l ruoyi-admin/target/vls-stream.jar | grep -q BOOT-INF/classes/db/migration/release/V1_2_0_072__cloud_device_continuous_configuration.sql
          unzip -l ruoyi-admin/target/vls-stream.jar | grep -q BOOT-INF/classes/db/migration/release/V1_2_0_073__release_confirmed_local_compute_test_isolation.sql
      - name: Build frontend
        working-directory: VLStream-Web/VLStream-ui
        env:
          VITE_API_BASE_URL: /bus/vls-server
        run: npm ci && npm run build
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.8"
      - name: Test optional tunnel runtime
        working-directory: deploy/release/tunnel-runtime
        run: go test ./...
      - name: Test optional OM conversion worker
        working-directory: deploy/om-converter
        run: python3 -m unittest discover -s . -p 'test_*.py'
      - name: Build optional tunnel runtime image
        run: docker build --file deploy/release/tunnel-runtime/Dockerfile --tag vlstream-tunnel-runtime:validate deploy/release/tunnel-runtime
      - name: Validate Compose files
        run: |
          docker compose --env-file deploy/release/.env.example -f deploy/release/compose.yaml config --quiet
          docker compose --env-file deploy/release/.env.example -f deploy/release/compose.external.yaml config --quiet
          docker compose --profile tunnel --env-file deploy/release/.env.example -f deploy/release/compose.yaml config --quiet
          docker compose --profile tunnel --env-file deploy/release/.env.example -f deploy/release/compose.external.yaml config --quiet
          docker compose --env-file deploy/release/.env.example -f deploy/release/compose.yaml -f deploy/release/compose.om.yaml config --quiet
      - name: Validate public initialization SQL
        run: |
          python3 scripts/release/verify-release-sql.py --kind vls deploy/release/sql/init/10-oortcloud-workflowforms-vls.sql
          python3 scripts/release/verify-release-sql.py --kind wvp deploy/release/sql/init/21-ry-wvp.sql.inc
          python3 -c 'from pathlib import Path; files=[Path("deploy/release/sql/init/20-create-wvp-database.sh"),Path("deploy/release/sql/init/21-import-ry-wvp.sh")]; bad=[str(p) for p in files if bytes([13]) in p.read_bytes()]; print("WVP init scripts use LF line endings" if not bad else "CRLF in WVP init scripts: "+", ".join(bad)); raise SystemExit(bool(bad))'

  images:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            context: VLStream-Cloud-Backend-Server/vls-stream
            dockerfile: VLStream-Cloud-Backend-Server/vls-stream/ruoyi-admin/Dockerfile.release
          - name: frontend
            context: .
            dockerfile: VLStream-Web/VLStream-ui/Dockerfile.release
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Reject private billing configuration from public image build context
        run: |
          if test -e VLStream-Cloud-Backend-Server/vls-stream/ruoyi-admin/config/application.yml; then
            echo ::error::Private billing configuration must not enter public image builds
            exit 1
          fi
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/oortcloudgroup/vlstream-${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          build-args: |
            VERSION=${{ github.ref_name }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  release:
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify container packages are public
        run: |
          for image in vlstream-backend vlstream-frontend; do
            token=$(curl -fsSL "https://ghcr.io/token?scope=repository:oortcloudgroup/${image}:pull" | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')
            status=$(curl -sS -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ${token}" \
              -H "Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.v2+json" \
              "https://ghcr.io/v2/oortcloudgroup/${image}/manifests/${GITHUB_REF_NAME#v}")
            test "$status" = "200"
          done
          image=vlstream-cloud-lite
          version=1.0.12
          token=$(curl -fsSL "https://ghcr.io/token?scope=repository:oortcloudgroup/${image}:pull" | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${token}" \
            -H "Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.v2+json" \
            "https://ghcr.io/v2/oortcloudgroup/${image}/manifests/${version}")
          test "$status" = "200"
      - name: Build release archive
        run: bash scripts/release/build-release.sh "${GITHUB_REF_NAME#v}"
      - name: Verify release archive
        run: |
          cd codex/release-dist
          sha256sum --check "VLStream-Cloud-${GITHUB_REF_NAME}.zip.sha256"
          python3 -m zipfile -l "VLStream-Cloud-${GITHUB_REF_NAME}.zip" | grep 'compose.yaml'
          python3 -m zipfile -l "VLStream-Cloud-${GITHUB_REF_NAME}.zip" | grep 'README.zh-CN.md'
          python3 -m zipfile -l "VLStream-Cloud-${GITHUB_REF_NAME}.zip" | grep 'compose.om.yaml'
          python3 -m zipfile -l "VLStream-Cloud-${GITHUB_REF_NAME}.zip" | grep 'docs/OM_CONVERSION.md'
          python3 -m zipfile -l VLStream-Cloud-${GITHUB_REF_NAME}.zip | grep docs/COMPUTE_BILLING.md
          python3 -m zipfile -l "VLStream-Cloud-${GITHUB_REF_NAME}.zip" | grep '10-oortcloud-workflowforms-vls.sql'
          python3 -m zipfile -l "VLStream-Cloud-${GITHUB_REF_NAME}.zip" | grep '20-create-wvp-database.sh'
          python3 -m zipfile -l "VLStream-Cloud-${GITHUB_REF_NAME}.zip" | grep '21-import-ry-wvp.sh'
          python3 -m zipfile -l "VLStream-Cloud-${GITHUB_REF_NAME}.zip" | grep '21-ry-wvp.sql.inc'
          python3 -c 'import sys,zipfile; z=zipfile.ZipFile(sys.argv[1]); p="VLStream-Cloud-"+sys.argv[2]+"/sql/init/"; names=(p+"20-create-wvp-database.sh",p+"21-import-ry-wvp.sh"); assert all(bytes([13]) not in z.read(n) for n in names), "WVP initializer scripts contain CRLF"; print("Archived WVP init scripts use LF line endings")' "VLStream-Cloud-${GITHUB_REF_NAME}.zip" "$GITHUB_REF_NAME"
          for migration in $(find ../../VLStream-Cloud-Backend-Server/vls-stream/ruoyi-admin/src/main/resources/db/migration/release -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort); do
           unzip -Z1 "VLStream-Cloud-${GITHUB_REF_NAME}.zip" | grep -F "$migration"
           done
           unzip -Z1 "VLStream-Cloud-${GITHUB_REF_NAME}.zip" | grep -F "tunnel-runtime/Dockerfile"
          unzip -p "VLStream-Cloud-${GITHUB_REF_NAME}.zip" \
            "VLStream-Cloud-${GITHUB_REF_NAME}/sql/init/10-oortcloud-workflowforms-vls.sql" > release-init.sql
          python3 ../../scripts/release/verify-release-sql.py --kind vls release-init.sql
          unzip -p "VLStream-Cloud-${GITHUB_REF_NAME}.zip" \
            "VLStream-Cloud-${GITHUB_REF_NAME}/sql/init/21-ry-wvp.sql.inc" > release-wvp-init.sql
          python3 ../../scripts/release/verify-release-sql.py --kind wvp release-wvp-init.sql
      - uses: softprops/action-gh-release@v3
        with:
          name: VLStream Cloud ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          files: |
            codex/release-dist/VLStream-Cloud-${{ github.ref_name }}.zip
            codex/release-dist/VLStream-Cloud-${{ github.ref_name }}.zip.sha256
