worker_processes 1;
pid logs/nginx.pid;
error_log logs/nginx-error.log;

events {
    worker_connections 1024;
}

http {
    include "__NGINX_MIME__";
    default_type application/octet-stream;
    access_log off;
    client_max_body_size 4096m;
    client_body_temp_path client_body_temp;
    proxy_temp_path proxy_temp;
    proxy_connect_timeout 10s;
    proxy_read_timeout 120s;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 127.0.0.1:17880;
        server_name localhost;

        location = / {
            return 302 /bus/vls-ui/;
        }

        location /bus/vls-ui/ {
            alias "__WEB_ROOT__/";
            try_files $uri $uri/ /bus/vls-ui/index.html;
        }

        location /bus/vls-server/ {
            proxy_pass http://127.0.0.1:17780/;
            proxy_request_buffering off;
        }

        location /task/ {
            proxy_pass http://127.0.0.1:17780;
        }

        location /bus/wvp-server/ {
            proxy_pass http://127.0.0.1:17781/;
        }

        location /bus/webrtc-streamer-server/ {
            proxy_pass http://127.0.0.1:19080/;
        }

        location /bus/zlm-server/ {
            proxy_pass http://127.0.0.1:17980/;
        }
    }
}
