name: vlstream-cloud

services:
  mysql:
    image: mysql:8.4.10-oraclelinux9
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-oortcloud_workflowforms_vls}
      MYSQL_USER: ${MYSQL_USER:-vlstream}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --lower-case-table-names=1
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7.4.9-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-vlstream}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data

  webrtc-streamer:
    image: ${WEBRTC_STREAMER_IMAGE:-mpromonet/webrtc-streamer:v0.8.16}
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["-C", "config.json", "-R", "50000:50010", "-e", "${WEBRTC_EXTERNAL_HOST:-host.docker.internal}"]
    ports:
      - "${WEBRTC_PORT:-8000}:8000"
      - "50000-50010:50000-50010/udp"

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/oortcloudgroup/vlstream-backend:1.2.1}
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "50m"
        max-file: "3"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-oortcloud_workflowforms_vls}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_USERNAME: ${MYSQL_USER:-vlstream}
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD}
      FLYWAY_ENABLED: "true"
      VLSTREAM_WEBRTC_ENABLED: "true"
      VLSTREAM_WEBRTC_PUBLIC_URL: /bus/webrtc-streamer-server
      VLSTREAM_WEBRTC_INTERNAL_URL: http://webrtc-streamer:8000
      VLSTREAM_ZLM_INTERNAL_URL: ${VLSTREAM_ZLM_INTERNAL_URL:-http://host.docker.internal:8081}
      VLSTREAM_ZLM_PUBLIC_URL: /bus/zlm-server
      ZLMEDIAKIT_SECRET: ${ZLMEDIAKIT_SECRET}
      VLSTREAM_WVP_INTERNAL_BASE_URL: ${VLSTREAM_WVP_INTERNAL_BASE_URL}
      VLSTREAM_NATIVE_DEVICE_LEGACY_ENABLED: "false"
      JAVA_OPTS: ${JAVA_OPTS:--Xms512m -Xmx2048m -Dfile.encoding=UTF-8}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - backend-data:/app/data
      - backend-logs:/app/logs

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/oortcloudgroup/vlstream-frontend:1.2.1}
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      WVP_UPSTREAM: ${WVP_UPSTREAM:-http://host.docker.internal:9080}
      ZLM_UPSTREAM: ${ZLM_UPSTREAM:-http://host.docker.internal:8081}
      NGINX_ENVSUBST_FILTER: "WVP_UPSTREAM|ZLM_UPSTREAM"
    depends_on:
      - backend
      - webrtc-streamer
    ports:
      - "${HTTP_PORT:-80}:80"

volumes:
  mysql-data:
  redis-data:
  minio-data:
  backend-data:
  backend-logs:
