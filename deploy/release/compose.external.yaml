name: vlstream-cloud

services:
  webrtc-streamer:
    image: ${WEBRTC_STREAMER_IMAGE:-mpromonet/webrtc-streamer:v0.8.16}
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["-C", "config.json", "-R", "50000:50010", "-e", "${WEBRTC_EXTERNAL_HOST:-host.docker.internal}"]
    ports:
      - "${WEBRTC_PORT:-8000}:8000"
      - "50000-50010:50000-50010/udp"

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/oortcloudgroup/vlstream-backend:1.1.2}
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      VLSTREAM_DEVICE_MEDIA_ALLOW_UNAUTHENTICATED: ${VLSTREAM_DEVICE_MEDIA_ALLOW_UNAUTHENTICATED:-true}
      VLSTREAM_DEVICE_MEDIA_OSS_CONFIG_KEY: ${VLSTREAM_DEVICE_MEDIA_OSS_CONFIG_KEY:-minio-device-media}
      VLSTREAM_P6SPY_ENABLED: ${VLSTREAM_P6SPY_ENABLED:-false}
      VLSTREAM_MODEL_DISPATCH_MQTT_CLIENT_ID: ${VLSTREAM_MODEL_DISPATCH_MQTT_CLIENT_ID:-vls-model-dispatch-backend}
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_URL: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT:-3306}/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&tinyInt1isBit=false
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_REDIS_HOST: ${REDIS_HOST}
      SPRING_REDIS_PORT: ${REDIS_PORT:-6379}
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD}
      FLYWAY_ENABLED: "true"
      VLSTREAM_WEBRTC_ENABLED: "true"
      VLSTREAM_WEBRTC_PUBLIC_URL: /bus/webrtc-streamer-server
      VLSTREAM_WEBRTC_INTERNAL_URL: http://webrtc-streamer:8000
      VLSTREAM_WVP_INTERNAL_BASE_URL: ${VLSTREAM_WVP_INTERNAL_BASE_URL}
      VLSTREAM_WVP_DEVICE_BASE_URL: ${VLSTREAM_WVP_DEVICE_BASE_URL}
      VLSTREAM_NATIVE_DEVICE_LEGACY_ENABLED: "false"
      VLSTREAM_TUNNEL_ENABLED: ${VLSTREAM_TUNNEL_ENABLED:-false}
      VLSTREAM_TUNNEL_REMOTE_ADDRESS: ${VLSTREAM_TUNNEL_REMOTE_ADDRESS:-}
      VLSTREAM_TUNNEL_NOISE_REMOTE_PUBLIC_KEY: ${VLSTREAM_TUNNEL_NOISE_REMOTE_PUBLIC_KEY:-}
      VLSTREAM_TUNNEL_SERVICE_SIGNING_SECRET: ${VLSTREAM_TUNNEL_SERVICE_SIGNING_SECRET:-}
      VLSTREAM_TUNNEL_CONTROL_API_TOKEN: ${VLSTREAM_TUNNEL_CONTROL_API_TOKEN:-}
      VLSTREAM_TUNNEL_GATEWAY_API_TOKEN: ${VLSTREAM_TUNNEL_GATEWAY_API_TOKEN:-}
      VLSTREAM_TUNNEL_GATEWAY_BASE_URL: ${VLSTREAM_TUNNEL_GATEWAY_BASE_URL:-}
      VLSTREAM_TUNNEL_ACCESS_SESSION_TTL_SECONDS: ${VLSTREAM_TUNNEL_ACCESS_SESSION_TTL_SECONDS:-36000}
      JAVA_OPTS: ${JAVA_OPTS:--Xms512m -Xmx2048m -Dfile.encoding=UTF-8}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - backend-data:/app/data
      - backend-logs:/app/logs

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/oortcloudgroup/vlstream-frontend:1.1.2}
    restart: unless-stopped
    depends_on:
      - backend
      - webrtc-streamer
    ports:
      - "${HTTP_PORT:-80}:80"

  tunnel-runtime:
    profiles: ["tunnel"]
    build:
      context: ./tunnel-runtime
    image: ${TUNNEL_RUNTIME_IMAGE:-vlstream/tunnel-runtime:local}
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - backend
    environment:
      TUNNEL_BACKEND_BASE_URL: http://backend:8080
      TUNNEL_CONTROL_API_TOKEN: ${VLSTREAM_TUNNEL_CONTROL_API_TOKEN:-}
      TUNNEL_GATEWAY_API_TOKEN: ${VLSTREAM_TUNNEL_GATEWAY_API_TOKEN:-}
      TUNNEL_GATEWAY_HOST_SUFFIX: ${VLSTREAM_TUNNEL_GATEWAY_HOST_SUFFIX:-}
      TUNNEL_PUBLIC_HTTPS: "true"
      TUNNEL_RATHOLE_NOISE_PRIVATE_KEY: ${VLSTREAM_TUNNEL_NOISE_PRIVATE_KEY:-}
      TUNNEL_RATHOLE_LISTEN_ADDRESS: 0.0.0.0:2333
      TUNNEL_GATEWAY_LISTEN_ADDRESS: 0.0.0.0:8088
    ports:
      - "${VLSTREAM_TUNNEL_CONTROL_PORT:-2333}:2333"
      - "127.0.0.1:${VLSTREAM_TUNNEL_GATEWAY_PORT:-8088}:8088"
    volumes:
      - tunnel-runtime-data:/var/lib/vls-tunnel
    tmpfs:
      - /tmp:size=16m,mode=1777
    healthcheck:
      test: ["CMD", "/usr/local/bin/vls-tunnel-runtime", "--healthcheck"]
      interval: 15s
      timeout: 3s
      retries: 5

volumes:
  backend-data:
  backend-logs:
  tunnel-runtime-data:
