name: vlstream-cloud

services:
  webrtc-streamer:
    image: ${WEBRTC_STREAMER_IMAGE:-mpromonet/webrtc-streamer:v0.8.16}
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["-C", "config.json", "-R", "50000:50010", "-e", "${WEBRTC_EXTERNAL_HOST:-host.docker.internal}"]
    ports:
      - "${WEBRTC_PORT:-8000}:8000"
      - "50000-50010:50000-50010/udp"

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/oortcloudgroup/vlstream-backend:1.2.2}
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: prod
      VLSTREAM_DEVICE_MEDIA_ALLOW_UNAUTHENTICATED: ${VLSTREAM_DEVICE_MEDIA_ALLOW_UNAUTHENTICATED:-false}
      VLSTREAM_DEVICE_MEDIA_OSS_CONFIG_KEY: ${VLSTREAM_DEVICE_MEDIA_OSS_CONFIG_KEY:-minio-device-media}
      VLSTREAM_MODEL_DISPATCH_MQTT_CLIENT_ID: ${VLSTREAM_MODEL_DISPATCH_MQTT_CLIENT_ID:-vls-model-dispatch-backend}
      VLSTREAM_MQTT_HOST: ${VLSTREAM_MQTT_HOST:-}
      VLSTREAM_MQTT_PORT: ${VLSTREAM_MQTT_PORT:-1883}
      VLSTREAM_MQTT_USERNAME: ${VLSTREAM_MQTT_USERNAME:-}
      VLSTREAM_MQTT_PASSWORD: ${VLSTREAM_MQTT_PASSWORD:-}
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_URL: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT:-3306}/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_REDIS_HOST: ${REDIS_HOST}
      SPRING_REDIS_PORT: ${REDIS_PORT:-6379}
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD}
      FLYWAY_ENABLED: "true"
      VLSTREAM_WEBRTC_ENABLED: "true"
      VLSTREAM_WEBRTC_PUBLIC_URL: /bus/webrtc-streamer-server
      VLSTREAM_WEBRTC_INTERNAL_URL: http://webrtc-streamer:8000
      VLSTREAM_ZLM_INTERNAL_URL: ${VLSTREAM_ZLM_INTERNAL_URL:-http://host.docker.internal:8081}
      VLSTREAM_ZLM_PUBLIC_URL: /bus/zlm-server
      ZLMEDIAKIT_SECRET: ${ZLMEDIAKIT_SECRET}
      VLSTREAM_WVP_INTERNAL_BASE_URL: ${VLSTREAM_WVP_INTERNAL_BASE_URL}
      VLSTREAM_WVP_DEVICE_BASE_URL: ${VLSTREAM_WVP_DEVICE_BASE_URL}
      UNIFIEDMESSAGINGSEND_URL: ${UNIFIEDMESSAGINGSEND_URL:-}
      XXL_JOB_ADMIN_ADDRESSES: ${XXL_JOB_ADMIN_ADDRESSES:-http://host.docker.internal:9100/xxl-job-admin}
      AUTH_REPORT_EXCLUDE_CLASSES: ${AUTH_REPORT_EXCLUDE_CLASSES:-ReModeJsonController,ProcessTemplateController,WfTXController}
      VLSTREAM_NATIVE_DEVICE_LEGACY_ENABLED: "false"
      JAVA_OPTS: ${JAVA_OPTS:--Xms512m -Xmx2048m -Dfile.encoding=UTF-8}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - backend-data:/app/data
      - backend-logs:/app/logs

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/oortcloudgroup/vlstream-frontend:1.2.2}
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      WVP_UPSTREAM: ${WVP_UPSTREAM:-http://host.docker.internal:9080}
      ZLM_UPSTREAM: ${ZLM_UPSTREAM:-http://host.docker.internal:8081}
      NGINX_ENVSUBST_FILTER: "WVP_UPSTREAM|ZLM_UPSTREAM"
    depends_on:
      - backend
      - webrtc-streamer
    ports:
      - "${HTTP_PORT:-80}:80"

volumes:
  backend-data:
  backend-logs:
