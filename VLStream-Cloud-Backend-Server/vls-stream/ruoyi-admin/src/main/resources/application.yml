# 项目相关配置
ruoyi:
  # 名称
  name: Flowable
  # 版本
  version: ${ruoyi-flowable-plus.version}
  # 版权年份
  copyrightYear: 2022
  # 实例演示开关
  demoEnabled: true
  # 获取ip地址开关
  addressEnabled: true
  # 缓存懒加载
  cacheLazy: false

captcha:
  # 页面 <参数设置> 可开启关闭 验证码校验
  # 验证码类型 math 数组计算 char 字符验证
  type: MATH
  # line 线段干扰 circle 圆圈干扰 shear 扭曲干扰
  category: CIRCLE
  # 数字验证码位数
  numberLength: 1
  # 字符验证码长度
  charLength: 4
# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  #  port: 8080
  servlet:
    # 应用的访问路径
    context-path: /
  # undertow 配置
  undertow:
    # HTTP post内容的最大大小。当值为-1时，默认值为大小是无限的
    max-http-post-size: -1
    # 以下的配置会影响buffer,这些buffer会用于服务器连接的IO操作,有点类似netty的池化内存管理
    # 每块buffer的空间大小,越小的空间被利用越充分
    buffer-size: 512
    # 是否分配的直接内存
    direct-buffers: true
    threads:
      # 设置IO线程数, 它主要执行非阻塞的任务,它们会负责多个连接, 默认设置每个CPU核心一个线程
      io: 8
      # 阻塞任务线程池, 当执行类似servlet请求阻塞操作, undertow会从这个线程池中取得线程,它的值设置取决于系统的负载
      worker: 256

# 日志配置
logging:
  level:
    com.ruoyi: "@logging.level@"
    org.springframework: warn
  config: classpath:logback-plus.xml

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  application:
    name: ${ruoyi.name}
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    # IDE 直接运行时不经过 Maven 资源过滤，环境通过 SPRING_PROFILES_ACTIVE 覆盖
    active: ${SPRING_PROFILES_ACTIVE:dev}
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 10MB
      # 设置总上传的文件大小
      max-request-size: 20MB
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: true
  mvc:
    format:
      date-time: yyyy-MM-dd HH:mm:ss
  jackson:
    time-zone: Asia/Shanghai
    # 日期格式化
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      # 格式化输出
      indent_output: false
      # 忽略无法转换的对象
      fail_on_empty_beans: false
  flyway:
    # 启动时自动执行尚未执行过的数据库升级脚本。
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    # v1.1.2 及更早版本没有 Flyway 历史表，首次升级时将现有数据库登记为基线。
    baseline-on-migrate: true
    baseline-version: "1.1.2"
    baseline-description: VLStream Cloud v1.1.2 baseline
    validate-on-migrate: true
    out-of-order: false
    deserialization:
      # 允许对象忽略json中不存在的属性
      fail_on_unknown_properties: false

# Sa-Token配置
sa-token:
  is-get-extra-enabled: true
  # token名称 (同时也是cookie名称)
  token-name: Authorization
  # token 登录后固定有效两小时，单位：秒
  timeout: 7200
  # 关闭独立的闲置过期，避免普通接口与工作流接口产生不同登录状态
  activity-timeout: -1
  # 是否允许同一账号并发登录 (为true时允许一起登录, 为false时新登录挤掉旧登录)
  is-concurrent: true
  # 在多人登录同一账号时，是否共用一个token (为true时所有登录共用一个token, 为false时每次登录新建一个token)
  is-share: false
  # 是否尝试从header里读取token
  is-read-header: true
  # 是否尝试从cookie里读取token
  is-read-cookie: false
  # token前缀
  token-prefix: "Bearer"
  # jwt秘钥
  jwt-secret-key: abcdefghijklmnopqrstuvwxyz

vlstream:
  # VLStream 原生 MQTT 设备（独立于旧 vls_device_info 自定义协议设备）
  native-device:
    # 无预绑定关系的设备首次上报时归属的默认租户
    default-tenant-id: ${VLSTREAM_NATIVE_DEVICE_DEFAULT_TENANT_ID:000000}
    # 超过该秒数未收到心跳时，页面可判定设备离线
    offline-timeout-seconds: ${VLSTREAM_NATIVE_DEVICE_OFFLINE_TIMEOUT_SECONDS:180}
    # QoS 1 幂等消息记录保留时长
    message-retention-hours: ${VLSTREAM_NATIVE_DEVICE_MESSAGE_RETENTION_HOURS:24}
  # ZLMediaKit 按需拉流与 WebRTC 播放配置
  zlm:
    enabled: ${VLSTREAM_ZLM_ENABLED:true}
    # 仅后端调用 ZLM REST API；本地默认使用 Docker Desktop 中的 ZLM
    internal-base-url: ${VLSTREAM_ZLM_INTERNAL_URL:http://127.0.0.1:8090}
    # 浏览器可访问的 ZLM HTTP(S) 地址；部署环境通过环境变量覆盖
    public-base-url: ${VLSTREAM_ZLM_PUBLIC_URL:http://127.0.0.1:8090}
    # ZLM API 密钥不写入任何环境配置文件，统一通过环境变量注入
    secret: ${ZLMEDIAKIT_SECRET:}
    app: ${VLSTREAM_ZLM_APP:vlstream}
    connect-timeout-millis: ${VLSTREAM_ZLM_CONNECT_TIMEOUT_MILLIS:3000}
    read-timeout-millis: ${VLSTREAM_ZLM_READ_TIMEOUT_MILLIS:10000}
    proxy-timeout-seconds: ${VLSTREAM_ZLM_PROXY_TIMEOUT_SECONDS:10}
  # OAuth2/JWT 认证配置
  auth:
    # JWT 公钥，用于验证 token 签名（ECDSA 非对称加密）
    public-key: ${BLADE_OAUTH2_PUBLIC_KEY:049787e408dea94acb3655acc5a7c7c7010bb9f140c84926c667ea616366082a118141c8dcb3e78a9d85d64fb765a250ff73448b18938f2219b94f782e28e1df64}
    # JWT 私钥，用于签发 token
    private-key: ${BLADE_OAUTH2_PRIVATE_KEY:7204a0e7dd3f23783fb04a82b7ae211441b12a8cb42694f9997e02babc4bf65b}
  # WebRTC 视频流配置
  webrtc:
    # 是否启用 WebRTC 功能
    enabled: ${VLSTREAM_WEBRTC_ENABLED:true}
    # WebRTC 服务提供者（如 webrtc-streamer）
    provider: ${VLSTREAM_WEBRTC_PROVIDER:webrtc-streamer}
    # WebRTC Streamer 运行时镜像；仅用于声明和状态展示，容器由部署脚本负责启动
    # 与 deploy/release/.env.example 中的 WEBRTC_STREAMER_IMAGE 保持一致
    runtime-image: ${VLSTREAM_WEBRTC_RUNTIME_IMAGE:mpromonet/webrtc-streamer:v0.8.16}
    # 返回给浏览器的公共访问地址；默认由同源 Nginx 转发，避免绑定公司测试域名
    public-base-url: ${VLSTREAM_WEBRTC_PUBLIC_URL:/bus/webrtc-streamer-server}
    # 仅 Java 后端健康探测使用的内网地址；Compose 中通过服务名覆盖
    internal-base-url: ${VLSTREAM_WEBRTC_INTERNAL_URL:http://127.0.0.1:8000}
    # 健康检查接口路径
    health-path: ${VLSTREAM_WEBRTC_HEALTH_PATH:/api/getMediaList}
    # HTTP 连接超时时间（毫秒）
    connect-timeout-millis: ${VLSTREAM_WEBRTC_CONNECT_TIMEOUT_MILLIS:1000}
    # HTTP 读取超时时间（毫秒）
    read-timeout-millis: ${VLSTREAM_WEBRTC_READ_TIMEOUT_MILLIS:1500}
    # 健康检查结果缓存时间（毫秒），避免频繁探测
    health-cache-millis: ${VLSTREAM_WEBRTC_HEALTH_CACHE_MILLIS:5000}
  # SSH 远程连接配置（用于远程执行训练/转换等命令）
  ssh:
    # SSH 服务器地址
    host: ${VLSTREAM_SSH_HOST:192.168.88.173}
    # SSH 端口
    port: ${VLSTREAM_SSH_PORT:22}
    # SSH 登录用户名
    username: ${VLSTREAM_SSH_USERNAME:oort}
    # SSH 登录密码
    password: ${VLSTREAM_SSH_PASSWORD:oort301}
  # AI 模型训练配置
  training:
    # Conda 环境初始化脚本路径
    conda-profile: ${VLSTREAM_TRAINING_CONDA_PROFILE:/data/work/anaconda3/etc/profile.d/conda.sh}
    # 默认使用的 Conda 环境名称
    default-conda-env: ${VLSTREAM_TRAINING_CONDA_ENV:yolo8}
    # 训练数据集默认工作目录
    default-work-dir: ${VLSTREAM_TRAINING_WORK_DIR:/data/work/ultralytics_yolov8-main/datasets}
    # 训练日志存放目录
    log-dir: ${VLSTREAM_TRAINING_LOG_DIR:logs}
    # 类别标签文件名（如 synset.txt 包含所有检测类别名称）
    synset-file-name: ${VLSTREAM_TRAINING_SYNSET_FILE_NAME:synset.txt}
  # 训练容器（Docker）资源配置
  training-container:
    # 训练使用的 Docker 镜像（含 YOLOv8 等依赖）
    image: ${VLSTREAM_TRAINING_CONTAINER_IMAGE:vlstream/yolo-training:8.3.240}
    # GPU 设备索引（多卡时指定使用哪张卡）
    gpu-index: ${VLSTREAM_TRAINING_GPU_INDEX:0}
    # GPU 设备唯一标识（UUID），用于精确绑定 GPU
    gpu-uuid: ${VLSTREAM_TRAINING_GPU_UUID:GPU-46808c9f-cd48-1feb-5304-5342999ca622}
    # 容器 CPU 核心数限制
    cpu-limit: ${VLSTREAM_TRAINING_CPU_LIMIT:12}
    # 容器内存限制
    memory-limit: ${VLSTREAM_TRAINING_MEMORY_LIMIT:12g}
    # DataLoader 多进程使用的容器共享内存，避免 Docker 默认 64MB 导致 Bus error
    shm-size: ${VLSTREAM_TRAINING_SHM_SIZE:4g}
    # YOLO DataLoader worker 数量，低共享内存环境建议设为 0
    workers: ${VLSTREAM_TRAINING_WORKERS:2}
    # 宿主机数据挂载目录（容器内 /data/work 的映射源）
    host-data-dir: ${VLSTREAM_TRAINING_HOST_DATA_DIR:/data/work}
    # Ultralytics 持久化配置和字体缓存目录，必须位于宿主机数据挂载目录内
    ultralytics-config-dir: ${VLSTREAM_ULTRALYTICS_CONFIG_DIR:/data/work/ultralytics_yolov8-main/.ultralytics}
    # 训练任务状态轮询间隔（毫秒）
    schedule-interval-millis: ${VLSTREAM_TRAINING_SCHEDULE_INTERVAL_MILLIS:3000}
  # 模型转换配置（YOLOv8 → 海思/昇腾芯片格式）
  model-conversion:
    # 海思模型导出脚本路径（PyTorch → ONNX → OM）
    hisilicon-exporter-script: ${VLSTREAM_HISILICON_EXPORTER_SCRIPT:/data/work/svp_pc/exporter/export_hisilicon_yolov8.py}
    # ATC（Ascend Tensor Compiler）环境初始化脚本
    atc-env-script: ${VLSTREAM_ATC_ENV_SCRIPT:/data/work/svp_pc/Ascend/ascend-toolkit/svp_latest/x86_64-linux/script/setenv.sh}
    # ATC 算子插入配置文件（用于量化、DVPP 等预处理算子配置）
    insert-op-config: ${VLSTREAM_ATC_INSERT_OP_CONFIG:/data/work/svp_pc/V3.0.0.12/sample/yolo/insert_op.cfg}
    # 目标芯片型号（如 Hi3519DV500）
    soc-version: ${VLSTREAM_ATC_SOC_VERSION:Hi3519DV500}
    # 量化校准图片数量
    calibration-image-count: ${VLSTREAM_ATC_CALIBRATION_IMAGE_COUNT:20}
  # 模型下发配置（通过 MQTT 将模型文件推送到边缘设备）
  model-dispatch:
    # 模型文件下载服务的公共地址
    public-base-url: ${VLSTREAM_MODEL_PUBLIC_BASE_URL:http://192.168.88.31:8080}
    # 下载 URL 的 HMAC-SHA256 签名密钥（必填；由部署方随机生成，仅保存在后端）
    signing-secret: ${VLSTREAM_MODEL_DOWNLOAD_SIGNING_SECRET:}
    # 下载链接有效期（秒）
    download-url-ttl-seconds: ${VLSTREAM_MODEL_DOWNLOAD_URL_TTL_SECONDS:1800}
    # MQTT 客户端标识
    mqtt-client-id: ${VLSTREAM_MODEL_DISPATCH_MQTT_CLIENT_ID:vls-model-dispatch-backend}
  # 硬件识别事件图片（预签名 PUT 直传 MinIO）
  device-media:
    # 对应 sys_oss_config.config_key；为空时复用当前默认 OSS 配置
    oss-config-key: ${VLSTREAM_DEVICE_MEDIA_OSS_CONFIG_KEY:}
    # 预签名上传地址有效期（秒）
    upload-url-ttl-seconds: ${VLSTREAM_DEVICE_MEDIA_UPLOAD_TTL_SECONDS:6000}
    # 单张事件图片最大字节数，默认 10 MiB
    max-image-bytes: ${VLSTREAM_DEVICE_MEDIA_MAX_IMAGE_BYTES:10485760}
    # 生产环境必须保持 false；dev 配置允许局域网先联调
    allow-unauthenticated: ${VLSTREAM_DEVICE_MEDIA_ALLOW_UNAUTHENTICATED:false}
  # RTSP 视频录制配置
  rtsp-recording:
    # 是否启用 RTSP 录制功能
    enabled: ${VLSTREAM_RTSP_RECORDING_ENABLED:true}
    # FFmpeg 可执行文件路径
    ffmpeg-path: ${VLSTREAM_RTSP_FFMPEG_PATH:ffmpeg}
    # 录制文件默认存储路径
    default-storage-path: ${VLSTREAM_RTSP_STORAGE_PATH:recordings}
    # 视频分段时长（秒），默认 300 秒即 5 分钟一段
    segment-seconds: ${VLSTREAM_RTSP_SEGMENT_SECONDS:300}
    # 停止录制进程时的等待超时（秒）
    process-stop-wait-seconds: ${VLSTREAM_RTSP_PROCESS_STOP_WAIT_SECONDS:5}
    # 文件被视为过期的阈值（秒），超过此时间未更新则认为录制异常
    stale-file-seconds: ${VLSTREAM_RTSP_STALE_FILE_SECONDS:5}
    # 录制状态刷新检查间隔（毫秒）
    refresh-interval-millis: ${VLSTREAM_RTSP_REFRESH_INTERVAL_MILLIS:10000}
  # MQTT 消息队列配置（用于设备通信和指令下发）
  mqtt:
    # MQTT Broker 地址
    host: ${VLSTREAM_MQTT_HOST:127.0.0.1}
    # MQTT Broker 端口
    port: ${VLSTREAM_MQTT_PORT:1883}
    # MQTT 认证用户名（为空则匿名连接）
    username: ${VLSTREAM_MQTT_USERNAME:}
    # MQTT 认证密码
    password: ${VLSTREAM_MQTT_PASSWORD:}
    # 主题前缀（所有自定义主题的公共前缀）
    topic-prefix: ${VLSTREAM_MQTT_TOPIC_PREFIX:oortcloud}
    # MQTT 客户端 ID 前缀（实际 ID 会追加随机后缀避免冲突）
    client-id-prefix: ${VLSTREAM_MQTT_CLIENT_ID_PREFIX:vls-dispatch}
    # QoS 服务质量等级（0=至多一次，1=至少一次，2=恰好一次）
    qos: ${VLSTREAM_MQTT_QOS:1}
    # 连接保活心跳间隔（秒）
    keep-alive-seconds: ${VLSTREAM_MQTT_KEEP_ALIVE_SECONDS:60}
    # 连接超时时间（秒）
    connection-timeout-seconds: ${VLSTREAM_MQTT_CONNECTION_TIMEOUT_SECONDS:10}
    # 摄像头显示设置下发主题
    vls-camera-display-setting-topic: ${VLSTREAM_MQTT_TOPIC_CAMERA_DISPLAY:oortcloud/vlsCameraDisplaySetting}
    # 摄像头 OSD（屏幕叠加显示）设置下发主题
    vls-camera-osd-setting-topic: ${VLSTREAM_MQTT_TOPIC_CAMERA_OSD:oortcloud/vlsCameraOsdSetting}
    # 音频异常检测设置下发主题
    vls-audio-anomaly-detection-setting-topic: ${VLSTREAM_MQTT_TOPIC_AUDIO_ANOMALY:oortcloud/vlsAudioAnomalyDetectionSetting}
    # 音频防御时间设置下发主题
    vls-audio-defense-time-setting-topic: ${VLSTREAM_MQTT_TOPIC_AUDIO_DEFENSE:oortcloud/vlsAudioDefenseTimeSetting}
    # 音频联动模式设置下发主题
    vls-audio-linkage-mode-setting-topic: ${VLSTREAM_MQTT_TOPIC_AUDIO_LINKAGE:oortcloud/vlsAudioLinkageModeSetting}
    # 时间策略下发主题（定时任务调度）
    vls-time-strategy-topic: ${VLSTREAM_MQTT_TOPIC_TIME_STRATEGY:oortcloud/vlsTimeStrategy}
    # 录像事件策略下发主题
    vls-record-event-strategy-topic: ${VLSTREAM_MQTT_TOPIC_RECORD_EVENT:oortcloud/vlsRecordEventStrategy}

vls:
  tenant:
    id: ${VLS_SINGLE_TENANT_ID:${SINGLE_TENANT_ID:000000}}
  data-initialization:
    # 开源服务默认不执行建表、种子数据、流程部署或历史数据修复。
    enabled: ${VLS_DATA_INITIALIZATION_ENABLED:false}
  apaas-sync:
    enabled: ${VLS_APAAS_SYNC_ENABLED:false}
  location-task:
    workflow:
      app-package: ${VLS_LOCATION_TASK_WORKFLOW_APP_PACKAGE:com.oort-event.demo}
      jump-path: ${VLS_LOCATION_TASK_WORKFLOW_JUMP_PATH:/event-detail}
      # JSON 模板的默认值由配置类提供，避免 YAML 占位符与 {{event_id}} 冲突
      jump-params: ${VLS_LOCATION_TASK_WORKFLOW_JUMP_PARAMS:}

# security配置
security:
  # 排除路径
  excludes:
    # 静态资源
    - /*.html
    - /**/*.html
    - /**/*.css
    - /**/*.js
    # 公共路径
    - /favicon.ico
    - /error
    # swagger 文档配置
    - /*/api-docs
    - /*/api-docs/**
    # actuator 监控配置
    - /actuator
    - /actuator/**
    - /logout
    - /blade-auth/token
    - /blade-auth/logout
    - /captchaImage
    - /login
    # 主动安全设备上报接口沿用 Go 服务的公开调用约定
    - /task/v1/event_report_camera
    - /task/v1/event_report_cameras
    # Hi3519DV500 设备需要在没有平台登录令牌的情况下拉取下发的 OM 文件
    - /vlsAlgorithmTraining/public/**
    - /vlsModelDispatch/public/**
    # 局域网联调阶段，硬件无需平台用户 Token 即可申请单对象预签名 PUT 地址；
    # 业务服务仍受 VLSTREAM_DEVICE_MEDIA_ALLOW_UNAUTHENTICATED 开关保护
    - /vlsDeviceMedia/public/**
    - /monitor/**
#    - /xxl-job-admin/**

# MyBatisPlus配置
# https://baomidou.com/config/
mybatis-plus:
  # 不支持多包, 如有需要可在注解配置 或 提升扫包等级
  # 例如 com.**.**.mapper
  mapperPackage: com.ruoyi.**.mapper
  # 对应的 XML 文件位置
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 实体扫描，多个package用逗号或者分号分隔
  typeAliasesPackage: com.ruoyi.**.domain
  # 启动时是否检查 MyBatis XML 文件的存在，默认不检查
  checkConfigLocation: false
  configuration:
    # 自动驼峰命名规则（camel case）映射
    mapUnderscoreToCamelCase: true
    # MyBatis 自动映射策略
    # NONE：不启用 PARTIAL：只对非嵌套 resultMap 自动映射 FULL：对所有 resultMap 自动映射
    autoMappingBehavior: PARTIAL
    # MyBatis 自动映射时未知列或未知属性处理策
    # NONE：不做处理 WARNING：打印相关警告 FAILING：抛出异常和详细信息
    autoMappingUnknownColumnBehavior: NONE
    # 更详细的日志输出 会有性能损耗 org.apache.ibatis.logging.stdout.StdOutImpl
    # 关闭日志记录 (可单纯使用 p6spy 分析) org.apache.ibatis.logging.nologging.NoLoggingImpl
    # 默认日志输出 org.apache.ibatis.logging.slf4j.Slf4jImpl
    logImpl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    # 是否打印 Logo banner
    banner: true
    dbConfig:
      # 主键类型
      # AUTO 自增 NONE 空 INPUT 用户输入 ASSIGN_ID 雪花 ASSIGN_UUID 唯一 UUID
      idType: ASSIGN_ID
      # 逻辑已删除值
      logicDeleteValue: 1
      # 逻辑未删除值
      logicNotDeleteValue: 0
      # 字段验证策略之 insert,在 insert 的时候的字段验证策略
      # IGNORED 忽略 NOT_NULL 非NULL NOT_EMPTY 非空 DEFAULT 默认 NEVER 不加入 SQL
      insertStrategy: NOT_NULL
      # 字段验证策略之 update,在 update 的时候的字段验证策略
      updateStrategy: NOT_NULL
      # 字段验证策略之 select,在 select 的时候的字段验证策略既 wrapper 根据内部 entity 生成的 where 条件
      where-strategy: NOT_NULL

# 数据加密
mybatis-encryptor:
  # 是否开启加密
  enable: false
  # 默认加密算法
  algorithm: BASE64
  # 编码方式 BASE64/HEX。默认BASE64
  encode: BASE64
  # 安全秘钥 对称算法的秘钥 如：AES，SM4
  password:
  # 公私钥 非对称算法的公私钥 如：SM2，RSA
  publicKey:
  privateKey:

# Swagger配置
swagger:
  info:
    # 标题
    title: '标题：${ruoyi.name}后台管理系统_接口文档'
    # 描述
    #    description: '描述：用于管理集团旗下公司的人员信息,具体包括XXX,XXX模块...'
    # 版本
    version: '版本号: ${ruoyi-flowable-plus.version}'
    # 作者信息
    contact:
      name: leichaoqun
  #      email: 1527468660@qq.com
  #      url: https://gitee.com/KonBAI-Q/ruoyi-flowable-plus
  components:
    # 鉴权方式配置
    security-schemes:
      apiKey:
        type: APIKEY
        in: HEADER
        name: ${sa-token.token-name}

springdoc:
  #  pathMapping: jiaping
  api-docs:
    # 是否开启接口文档
    enabled: true
  #    path: ${SWAGGER_PRE:}/v3/api-docs
  swagger-ui:
    config-url: ../v3/api-docs/swagger-config
    url: ../v3/api-docs
    #    url: ../v3/api-docs/系统模块
    #    config-url: ${{SWAGGER_PRE:}/v3/api-docs/swagger-config
    #    url: ${SWAGGER_PRE:}/v3/api-docs/系统模块
    enabled: true
    # 持久化认证数据
    persistAuthorization: false
    operationsSorter: method
    docExpansion: none
    tagsSorter: alpha
  #这里定义了两个分组，可定义多个，也可以不定义
  group-configs:
    - group: 流程模块
      packages-to-scan: com.ruoyi.web.controller.workflow
    - group: 系统模块
      packages-to-scan: com.ruoyi.web.controller.system


knife4j:
  # 开启增强配置
  enable: true
  #开启生产环境屏蔽
  production: false
  basic:
    enable: false
    username: report
    password: wms1314


# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*

# 全局线程池相关配置
thread-pool:
  # 是否开启线程池
  enabled: false
  # 队列最大长度
  queueCapacity: 128
  # 线程池维护线程所允许的空闲时间
  keepAliveSeconds: 300

--- # 分布式锁 lock4j 全局配置
lock4j:
  # 获取分布式锁超时时间，默认为 3000 毫秒
  acquire-timeout: 3000
  # 分布式锁的超时时间，默认为 30 秒
  expire: 30000

--- # Actuator 监控端点的配置项
management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: ALWAYS
#    logfile:
#      external-file: ./logs/sys-console.log

--- # Flowable 配置
flowable:
  # 是否开启定时任务 job
  # async-executor-activate: 启用异步执行器，用于处理异步任务（如定时任务、异步延续、异步服务任务等）
  # 开启后会启动单独的线程池来处理异步任务，避免阻塞主流程
  async-executor-activate: false

  # job-executor-activate: 激活定时器执行器（已注释）
  # 用于处理流程中的定时器事件（如定时边界事件、定时启动事件等）
  # 注意：在较新版本的Flowable中，async-executor-activate已经包含了定时器执行的功能
  # 因此通常只需要开启async-executor-activate即可
#  job-executor-activate: true
  core-pool-size: 10
  max-pool-size: 50
  #定时任务执行间隔
  async-executor:
    timer-period: 30000          # 轮询间隔 30 秒
    max-timer-jobs-per-acquisition: 10  # 每次获取任务数
  # 库与数据库表结构不一致时，会自动将数据库表结构升级至新版本。
  database-schema-update: true
  idm:
    # 关闭idm引擎 数据库不会创建act_id_*表，流程流转不会使用act_id_*相关的表
    enabled: false
  # 关闭流程定义文件自动检查
  check-process-definitions: false
  # 是否启用历史任务数据异步处理
  async-history-executor-activate: true
  # 历史级别
  history-level: audit
