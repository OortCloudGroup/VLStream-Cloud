services:
  emqx:
    image: ${EMQX_IMAGE:-192.168.88.150:80/opensource/emqx/emqx:5.4}
    container_name: emqx
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      EMQX_NODE_NAME: emqx@127.0.0.1
      EMQX_NODE__COOKIE: ${EMQX_NODE_COOKIE:?请在 script/docker/.env 中配置 EMQX_NODE_COOKIE}
      EMQX_DASHBOARD__DEFAULT_PASSWORD: '"${EMQX_DASHBOARD_PASSWORD:?请在 script/docker/.env 中配置 EMQX_DASHBOARD_PASSWORD}"'
      EMQX_LISTENERS__SSL__DEFAULT__BIND: 0
      EMQX_LISTENERS__WS__DEFAULT__BIND: 0
      EMQX_LISTENERS__WSS__DEFAULT__BIND: 0
      EMQX_AUTHENTICATION: >-
        [{mechanism = password_based, backend = built_in_database,
        user_id_type = username, enable = true,
        password_hash_algorithm = {name = sha256, salt_position = suffix}}]
    volumes:
      - /docker/emqx/data:/opt/emqx/data
      - /docker/emqx/log:/opt/emqx/log
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    network_mode: "host"

  mysql:
    image: mysql:8.0.31
    container_name: mysql
    environment:
      # 时区上海
      TZ: Asia/Shanghai
      # root 密码
      MYSQL_ROOT_PASSWORD: root
      # 初始化数据库(后续的初始化sql会在这个库执行)
      MYSQL_DATABASE: ry-vue
    ports:
      - "3306:3306"
    volumes:
      # 数据挂载
      - /docker/mysql/data/:/var/lib/mysql/
      # 配置挂载
      - /docker/mysql/conf/:/etc/mysql/conf.d/
    command:
      # 将mysql8.0默认密码策略 修改为 原先 策略 (mysql8.0对其默认策略做了更改 会导致密码无法匹配)
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci
      --explicit_defaults_for_timestamp=true
      --lower_case_table_names=1
    privileged: true
    network_mode: "host"

  nginx-web:
    image: nginx:1.22.1
    container_name: nginx-web
    environment:
      # 时区上海
      TZ: Asia/Shanghai
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # 证书映射
      - /docker/nginx/cert:/etc/nginx/cert
      # 配置文件映射
      - /docker/nginx/conf/nginx.conf:/etc/nginx/nginx.conf
      # 页面目录
      - /docker/nginx/html:/usr/share/nginx/html
      # 日志目录
      - /docker/nginx/log:/var/log/nginx
    privileged: true
    network_mode: "host"

  redis:
    image: redis:6.2.7
    container_name: redis
    ports:
      - "6379:6379"
    environment:
      # 时区上海
      TZ: Asia/Shanghai
    volumes:
      # 配置文件
      - /docker/redis/conf:/redis/config:rw
      # 数据文件
      - /docker/redis/data/:/redis/data/:rw
    command: "redis-server /redis/config/redis.conf"
    privileged: true
    network_mode: "host"

  minio:
    image: minio/minio:RELEASE.2023-03-24T21-41-23Z
    container_name: minio
    ports:
      # api 端口
      - "9000:9000"
      # 控制台端口
      - "9001:9001"
    environment:
      # 时区上海
      TZ: Asia/Shanghai
      # 管理后台用户名
      MINIO_ROOT_USER: ruoyi
      # 管理后台密码，最小8个字符
      MINIO_ROOT_PASSWORD: ruoyi123
      # https需要指定域名
      #MINIO_SERVER_URL: "https://xxx.com:9000"
      #MINIO_BROWSER_REDIRECT_URL: "https://xxx.com:9001"
      # 开启压缩 on 开启 off 关闭
      MINIO_COMPRESS: "off"
      # 扩展名 .pdf,.doc 为空 所有类型均压缩
      MINIO_COMPRESS_EXTENSIONS: ""
      # mime 类型 application/pdf 为空 所有类型均压缩
      MINIO_COMPRESS_MIME_TYPES: ""
    volumes:
      # 映射当前目录下的data目录至容器内/data目录
      - /docker/minio/data:/data
      # 映射配置目录
      - /docker/minio/config:/root/.minio/
    command: server --address ':9000' --console-address ':9001' /data  # 指定容器中的目录 /data
    privileged: true
    network_mode: "host"

  ruoyi-server1:
    image: ruoyi/ruoyi-server:0.8.3
    container_name: ruoyi-server1
    environment:
      # 时区上海
      TZ: Asia/Shanghai
      SERVER_PORT: 8080
      VLSTREAM_MQTT_HOST: 127.0.0.1
      VLSTREAM_MQTT_PORT: 1883
      VLSTREAM_MQTT_USERNAME: ${VLSTREAM_MQTT_USERNAME:?请在 script/docker/.env 中配置 VLSTREAM_MQTT_USERNAME}
      VLSTREAM_MQTT_PASSWORD: ${VLSTREAM_MQTT_PASSWORD:?请在 script/docker/.env 中配置 VLSTREAM_MQTT_PASSWORD}
      VLSTREAM_MODEL_DISPATCH_MQTT_CLIENT_ID: vls-model-dispatch-backend-01
      VLSTREAM_DEVICE_MEDIA_OSS_CONFIG_KEY: ${VLSTREAM_DEVICE_MEDIA_OSS_CONFIG_KEY:-}
      VLSTREAM_DEVICE_MEDIA_UPLOAD_TTL_SECONDS: ${VLSTREAM_DEVICE_MEDIA_UPLOAD_TTL_SECONDS:-600}
      VLSTREAM_DEVICE_MEDIA_MAX_IMAGE_BYTES: ${VLSTREAM_DEVICE_MEDIA_MAX_IMAGE_BYTES:-10485760}
      VLSTREAM_DEVICE_MEDIA_ALLOW_UNAUTHENTICATED: ${VLSTREAM_DEVICE_MEDIA_ALLOW_UNAUTHENTICATED:-false}
    depends_on:
      emqx:
        condition: service_healthy
    volumes:
      # 配置文件
      - /docker/server1/logs/:/ruoyi/server/logs/
      # skywalking 探针
#      - /docker/skywalking/agent/:/ruoyi/skywalking/agent
    privileged: true
    network_mode: "host"

  ruoyi-server2:
    image: "ruoyi/ruoyi-server:0.8.3"
    container_name: ruoyi-server2
    environment:
      # 时区上海
      TZ: Asia/Shanghai
      SERVER_PORT: 8081
      VLSTREAM_MQTT_HOST: 127.0.0.1
      VLSTREAM_MQTT_PORT: 1883
      VLSTREAM_MQTT_USERNAME: ${VLSTREAM_MQTT_USERNAME:?请在 script/docker/.env 中配置 VLSTREAM_MQTT_USERNAME}
      VLSTREAM_MQTT_PASSWORD: ${VLSTREAM_MQTT_PASSWORD:?请在 script/docker/.env 中配置 VLSTREAM_MQTT_PASSWORD}
      VLSTREAM_MODEL_DISPATCH_MQTT_CLIENT_ID: vls-model-dispatch-backend-02
      VLSTREAM_DEVICE_MEDIA_OSS_CONFIG_KEY: ${VLSTREAM_DEVICE_MEDIA_OSS_CONFIG_KEY:-}
      VLSTREAM_DEVICE_MEDIA_UPLOAD_TTL_SECONDS: ${VLSTREAM_DEVICE_MEDIA_UPLOAD_TTL_SECONDS:-600}
      VLSTREAM_DEVICE_MEDIA_MAX_IMAGE_BYTES: ${VLSTREAM_DEVICE_MEDIA_MAX_IMAGE_BYTES:-10485760}
      VLSTREAM_DEVICE_MEDIA_ALLOW_UNAUTHENTICATED: ${VLSTREAM_DEVICE_MEDIA_ALLOW_UNAUTHENTICATED:-false}
    depends_on:
      emqx:
        condition: service_healthy
    volumes:
      # 配置文件
      - /docker/server2/logs/:/ruoyi/server/logs/
      # skywalking 探针
#      - /docker/skywalking/agent/:/ruoyi/skywalking/agent
    privileged: true
    network_mode: "host"

  ruoyi-monitor-admin:
    image: ruoyi/ruoyi-monitor-admin:0.8.3
    container_name: ruoyi-monitor-admin
    environment:
      # 时区上海
      TZ: Asia/Shanghai
    volumes:
      # 配置文件
      - /docker/monitor/logs/:/ruoyi/monitor/logs
    privileged: true
    network_mode: "host"

  ruoyi-xxl-job-admin:
    image: ruoyi/ruoyi-xxl-job-admin:0.8.3
    container_name: ruoyi-xxl-job-admin
    environment:
      # 时区上海
      TZ: Asia/Shanghai
    volumes:
      # 配置文件
      - /docker/xxljob/logs/:/ruoyi/xxljob/logs
    privileged: true
    network_mode: "host"
